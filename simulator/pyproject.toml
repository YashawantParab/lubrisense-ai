[project]
name = "lubrisense-simulator"
version = "0.1.0"
description = "LubriSense AI physics-informed industrial simulator — synthetic telemetry for a centralized lubrication system and the machine it protects. DEMO/SYNTHETIC ENGINEERING DATA only; see docs/SIMULATOR.md."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.9,<3",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.7,<0.8",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "types-PyYAML>=6.0,<7",
  "matplotlib>=3.9,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simulator"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
