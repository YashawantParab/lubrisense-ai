# =============================================================================
# DEMO SYNTHETIC FAILURE ASSUMPTIONS.
# NOT VALIDATED PRODUCTION FAILURE THRESHOLDS.
# =============================================================================
# See docs/FAILURE_MODE_CATALOG.md §11 and docs/SCENARIO_ENGINE.md §7-§8. Represents
# connectivity loss internally only (quality=COMMUNICATION_LOSS across every sensor on the
# machine, true_value still computed) — no real edge buffering/MQTT store-and-forward
# behavior exists yet; that is Phase 5/6 (Phase 4 brief §14 explicitly scopes this out).

name: network_failure
scenario_type: NETWORK_FAILURE
target_type: MACHINE
description: >
  Simultaneous loss of telemetry delivery for every sensor on the machine at once —
  distinguishing it from a single Sensor Dropout — represented as intermittent outage
  windows by default.

default_start_seconds: 0.0
default_severity_max: 1.0

progression:
  type: INTERMITTENT
  onset_seconds: 0.0
  period_s: 3600.0   # hourly windows
  duty_cycle: 0.1    # ~6-minute outage per hour

lifecycle:
  developing_threshold: 0.0
  severe_threshold: null

recovery:
  enabled: false

effect_params: {}
