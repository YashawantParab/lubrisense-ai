[project]
name = "lubrisense-edge"
version = "0.1.0"
description = "LubriSense AI edge-controller reference implementation — local acquisition, deterministic local rules, buffering/store-and-forward, MQTT publishing. See docs/EDGE_ARCHITECTURE.md."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "paho-mqtt>=2.1,<3",
  "lubrisense-simulator",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.7,<0.8",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "types-PyYAML>=6.0,<7",
]

[tool.uv.sources]
lubrisense-simulator = { path = "../simulator", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "paho.mqtt.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "mqtt: requires a real running MQTT broker (lubrisense-mosquitto)",
]
