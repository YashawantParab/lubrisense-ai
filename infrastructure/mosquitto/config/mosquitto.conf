# Eclipse Mosquitto — local development broker configuration.
#
# Anonymous access is enabled here deliberately: this is a local reference-development
# broker standing in for real edge/gateway MQTT infrastructure (see docs/ARCHITECTURE.md
# §10). A production/customer deployment must configure authentication and TLS; that is
# explicitly out of scope for Phase 1 (see LOOP.md — do not invent proprietary security
# posture without real requirements).

listener 1883
protocol mqtt

# Optional websocket listener, useful for future browser-based debugging tools.
listener 9001
protocol websockets

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
