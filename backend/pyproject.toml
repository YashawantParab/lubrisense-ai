[project]
name = "lubrisense-backend"
version = "0.1.0"
description = "LubriSense AI backend platform — condition-driven intelligent lubrication reference implementation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.33",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "alembic>=1.13,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "redis>=5.1,<6",
  "aiokafka>=0.11,<0.12",
  "paho-mqtt>=2.1,<3",
  "PyYAML>=6.0,<7",
  "lubrisense-ml-service",
  "pgvector>=0.5.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.7,<0.8",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<0.25",
  "httpx>=0.27,<0.28",
  "types-PyYAML>=6.0,<7",
]

[tool.uv.sources]
lubrisense-ml-service = { path = "../ml-service", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["paho.mqtt.*", "aiokafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
