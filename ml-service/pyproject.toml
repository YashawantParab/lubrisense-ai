[project]
name = "lubrisense-ml-service"
version = "0.1.0"
description = "LubriSense AI ML service — dataset building, training, evaluation, explainability, and inference for Machine & Sensor Intelligence evidence. See docs/ML_ARCHITECTURE.md."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "numpy>=2.1,<3",
  "scikit-learn>=1.5,<1.6",
  "joblib>=1.4,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.7,<0.8",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "types-PyYAML>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml_service"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "db: requires a real running Postgres with materialized feature vectors",
]
