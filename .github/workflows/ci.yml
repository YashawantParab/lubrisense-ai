name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: lubrisense
          POSTGRES_PASSWORD: lubrisense
          POSTGRES_DB: lubrisense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lubrisense -d lubrisense"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://lubrisense:lubrisense@localhost:5432/lubrisense
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.9"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check .

      - name: Type check (mypy)
        working-directory: backend
        run: uv run mypy app

      - name: Run database migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Test (pytest)
        working-directory: backend
        run: uv run pytest

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Format check
        working-directory: frontend
        run: npm run format:check

      - name: Build
        working-directory: frontend
        run: npm run build
